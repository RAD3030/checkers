<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Peer Checkers</title>
  <script src="https://unpkg.com"></script>
  <style>
    body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; background: #1e1e1e; color: white; margin-top: 20px; }
    #controls { margin-bottom: 15px; display: flex; gap: 10px; align-items: center; }
    input, button { padding: 8px 12px; font-size: 14px; border-radius: 4px; border: none; }
    button { background: #4CAF50; color: white; cursor: pointer; font-weight: bold; }
    button:hover { background: #45a049; }
    #board { display: grid; grid-template-columns: repeat(8, 55px); grid-template-rows: repeat(8, 55px); border: 4px solid #444; }
    .sq { width: 55px; height: 55px; display: flex; justify-content: center; align-items: center; }
    .light { background: #eeeed2; }
    .dark { background: #769656; }
    .selected { outline: 4px solid yellow; z-index: 2; }
    .piece { width: 42px; height: 42px; border-radius: 50%; cursor: pointer; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 18px; box-shadow: 0 3px 5px rgba(0,0,0,0.5); }
    .red { background: #d93829; color: gold; }
    .black { background: #222; color: gold; border: 2px solid #555; }
    #status { margin-top: 12px; font-size: 16px; color: #ddd; }
  </style>
</head>
<body>
  <h2>Multiplayer Checkers</h2>
  <div id="controls">
    <span>Your ID: <b id="my-id">Connecting...</b></span>
    <input type="text" id="peer-id" placeholder="Friend's ID">
    <button onclick="connectToFriend()">Join Game</button>
    <button onclick="resetGame()" style="background:#555;">Reset Board</button>
  </div>
  <div id="board"></div>
  <div id="status">Share Your ID with your friend, or enter theirs to join!</div>

  <script>
    const boardEl = document.getElementById('board');
    const statusEl = document.getElementById('status');
    let board = [];
    let selected = null;
    let turn = 'red';
    let myColor = 'red';
    let conn = null;

    // Generate short 4-letter Room ID
    const shortId = 'chk-' + Math.random().toString(36).substring(2, 6);
    const peer = new Peer(shortId);

    peer.on('open', id => document.getElementById('my-id').innerText = id);
    peer.on('connection', connection => {
      conn = connection;
      myColor = 'red';
      setupConn();
      statusEl.innerText = "Friend joined! You are RED (Your turn).";
    });

    function connectToFriend() {
      const friendId = document.getElementById('peer-id').value.trim();
      if (!friendId) return;
      conn = peer.connect(friendId);
      myColor = 'black';
      setupConn();
      statusEl.innerText = "Connected! You are BLACK (Red goes first).";
    }

    function setupConn() {
      conn.on('data', data => {
        if (data.type === 'move') {
          board = data.board;
          turn = data.turn;
          render();
          statusEl.innerText = `Turn: ${turn.toUpperCase()} (You are ${myColor.toUpperCase()})`;
        } else if (data.type === 'reset') {
          initBoard();
        }
      });
    }

    function initBoard() {
      board = Array(8).fill(null).map(() => Array(8).fill(null));
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          if ((r + c) % 2 === 1) {
            if (r < 3) board[r][c] = { color: 'black', king: false };
            if (r > 4) board[r][c] = { color: 'red', king: false };
          }
        }
      }
      turn = 'red';
      selected = null;
      render();
    }

    function resetGame() {
      initBoard();
      if (conn) conn.send({ type: 'reset' });
    }

    function render() {
      boardEl.innerHTML = '';
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const sq = document.createElement('div');
          sq.className = 'sq ' + ((r + c) % 2 === 0 ? 'light' : 'dark');
          if (selected && selected.r === r && selected.c === c) sq.classList.add('selected');
          sq.onclick = () => handleSquareClick(r, c);

          const p = board[r][c];
          if (p) {
            const piece = document.createElement('div');
            piece.className = 'piece ' + p.color;
            if (p.king) piece.innerText = '♔';
            sq.appendChild(piece);
          }
          boardEl.appendChild(sq);
        }
      }
    }

    function handleSquareClick(r, c) {
      if (conn && turn !== myColor) return;
      const clickedPiece = board[r][c];

      if (clickedPiece && clickedPiece.color === turn) {
        selected = { r, c };
        render();
        return;
      }

      if (selected && !clickedPiece && (r + c) % 2 === 1) {
        const dr = r - selected.r;
        const dc = c - selected.c;
        const piece = board[selected.r][selected.c];
        const forward = piece.color === 'red' ? -1 : 1;

        // Normal 1-step diagonal move
        if (Math.abs(dc) === 1 && (dr === forward || (piece.king && Math.abs(dr) === 1))) {
          movePiece(selected.r, selected.c, r, c);
        }
        // 2-step jump capture
        else if (Math.abs(dc) === 2 && (dr === forward * 2 || (piece.king && Math.abs(dr) === 2))) {
          const midR = selected.r + dr / 2;
          const midC = selected.c + dc / 2;
          const jumped = board[midR][midC];
          if (jumped && jumped.color !== piece.color) {
            board[midR][midC] = null;
            movePiece(selected.r, selected.c, r, c);
          }
        }
      }
    }

    function movePiece(fromR, fromC, toR, toC) {
      const piece = board[fromR][fromC];
      board[toR][toC] = piece;
      board[fromR][fromC] = null;
      if ((piece.color === 'red' && toR === 0) || (piece.color === 'black' && toR === 7)) {
        piece.king = true;
      }
      selected = null;
      turn = turn === 'red' ? 'black' : 'red';
      render();
      statusEl.innerText = `Turn: ${turn.toUpperCase()}`;
      if (conn) conn.send({ type: 'move', board, turn });
    }

    initBoard();
  </script>
</body>
</html>
