<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Custom Room Checkers</title>
  <script src="https://cloudflare.com"></script>
  <style>
    body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; background: #1e1e1e; color: white; margin-top: 20px; }
    #controls { margin-bottom: 15px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }
    input, button { padding: 8px 12px; font-size: 14px; border-radius: 4px; border: none; }
    input { width: 150px; }
    button { background: #4CAF50; color: white; cursor: pointer; font-weight: bold; }
    button:hover { background: #45a049; }
    .join-btn { background: #2196F3; }
    .join-btn:hover { background: #0b7dda; }
    .reset-btn { background: #555; }
    .reset-btn:hover { background: #444; }
    #board { display: grid; grid-template-columns: repeat(8, 55px); grid-template-rows: repeat(8, 55px); border: 4px solid #444; }
    .sq { width: 55px; height: 55px; display: flex; justify-content: center; align-items: center; }
    .light { background: #eeeed2; }
    .dark { background: #769656; }
    .selected { outline: 4px solid yellow; z-index: 2; }
    .piece { width: 42px; height: 42px; border-radius: 50%; cursor: pointer; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 18px; box-shadow: 0 3px 5px rgba(0,0,0,0.5); }
    .red { background: #d93829; color: gold; }
    .black { background: #222; color: gold; border: 2px solid #555; }
    #status { margin-top: 12px; font-size: 16px; color: #ddd; text-align: center; }
  </style>
</head>
<body>
  <h2>Multiplayer Checkers</h2>
  <div id="controls">
    <input type="text" id="room-code" placeholder="Type Room Code (e.g. 555)">
    <button onclick="hostGame()">Host Game (Red)</button>
    <button class="join-btn" onclick="joinGame()">Join Game (Black)</button>
    <button class="reset-btn" onclick="resetGame()">Reset</button>
  </div>
  <div id="board"></div>
  <div id="status">Type a secret room code above: one player clicks Host, the other clicks Join!</div>

  <script>
    const boardEl = document.getElementById('board');
    const statusEl = document.getElementById('status');
    let board = [];
    let selected = null;
    let turn = 'red';
    let myColor = 'red';
    let peer = null;
    let conn = null;

    function getCleanCode() {
      const raw = document.getElementById('room-code').value.trim().toLowerCase().replace(/[^a-z0-9]/g, '');
      if (!raw) {
        statusEl.innerText = "Please type a room code first!";
        return null;
      }
      return 'school-chk-' + raw;
    }

    function hostGame() {
      const roomId = getCleanCode();
      if (!roomId) return;
      if (peer) peer.destroy();

      statusEl.innerText = "Creating room...";
      peer = new Peer(roomId);
      myColor = 'red';

      peer.on('open', () => {
        statusEl.innerText = `Room Ready! Tell your friend to enter "${document.getElementById('room-code').value.trim()}" and click Join.`;
      });

      peer.on('connection', connection => {
        conn = connection;
        setupConn();
        statusEl.innerText = "Friend connected! You are RED (Your turn).";
      });

      peer.on('error', err => {
        if (err.type === 'unavailable-id') {
          statusEl.innerText = "That room code is already taken! Try a different number or word.";
        } else {
          statusEl.innerText = "Connection blocked by school Wi-Fi (" + err.type + "). Pass-and-play still works!";
        }
      });
    }

    function joinGame() {
      const roomId = getCleanCode();
      if (!roomId) return;
      if (peer) peer.destroy();

      statusEl.innerText = "Joining room...";
      peer = new Peer();
      myColor = 'black';

      peer.on('open', () => {
        conn = peer.connect(roomId);
        setupConn();
        conn.on('open', () => {
          statusEl.innerText = "Connected! You are BLACK (Red goes first).";
        });
      });

      peer.on('error', err => {
        statusEl.innerText = "Could not find room or blocked by Wi-Fi (" + err.type + ").";
      });
    }

    function setupConn() {
      conn.on('data', data => {
        if (data.type === 'move') {
          board = data.board;
          turn = data.turn;
          render();
          statusEl.innerText = `Turn: ${turn.toUpperCase()} (You are ${myColor.toUpperCase()})`;
        } else if (data.type === 'reset') {
          initBoard();
        }
      });
    }

    function initBoard() {
      board = Array(8).fill(null).map(() => Array(8).fill(null));
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          if ((r + c) % 2 === 1) {
            if (r < 3) board[r][c] = { color: 'black', king: false };
            if (r > 4) board[r][c] = { color: 'red', king: false };
          }
        }
      }
      turn = 'red';
      selected = null;
      render();
    }

    function resetGame() {
      initBoard();
      if (conn) conn.send({ type: 'reset' });
    }

    function render() {
      boardEl.innerHTML = '';
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const sq = document.createElement('div');
          sq.className = 'sq ' + ((r + c) % 2 === 0 ? 'light' : 'dark');
          if (selected && selected.r === r && selected.c === c) sq.classList.add('selected');
          sq.onclick = () => handleSquareClick(r, c);

          const p = board[r][c];
          if (p) {
            const piece = document.createElement('div');
            piece.className = 'piece ' + p.color;
            if (p.king) piece.innerText = '♔';
            sq.appendChild(piece);
          }
          boardEl.appendChild(sq);
        }
      }
    }

    function handleSquareClick(r, c) {
      if (conn && turn !== myColor) return;
      const clickedPiece = board[r][c];

      if (clickedPiece && clickedPiece.color === turn) {
        selected = { r, c };
        render();
        return;
      }

      if (selected && !clickedPiece && (r + c) % 2 === 1) {
        const dr = r - selected.r;
        const dc = c - selected.c;
        const piece = board[selected.r][selected.c];
        const forward = piece.color === 'red' ? -1 : 1;

        if (Math.abs(dc) === 1 && (dr === forward || (piece.king && Math.abs(dr) === 1))) {
          movePiece(selected.r, selected.c, r, c);
        } else if (Math.abs(dc) === 2 && (dr === forward * 2 || (piece.king && Math.abs(dr) === 2))) {
          const midR = selected.r + dr / 2;
          const midC = selected.c + dc / 2;
          const jumped = board[midR][midC];
          if (jumped && jumped.color !== piece.color) {
            board[midR][midC] = null;
            movePiece(selected.r, selected.c, r, c);
          }
        }
      }
    }

    function movePiece(fromR, fromC, toR, toC) {
      const piece = board[fromR][fromC];
      board[toR][toC] = piece;
      board[fromR][fromC] = null;
      if ((piece.color === 'red' && toR === 0) || (piece.color === 'black' && toR === 7)) {
        piece.king = true;
      }
      selected = null;
      turn = turn === 'red' ? 'black' : 'red';
      render();
      statusEl.innerText = `Turn: ${turn.toUpperCase()}`;
      if (conn) conn.send({ type: 'move', board, turn });
    }

    initBoard();
  </script>
</body>
</html>
